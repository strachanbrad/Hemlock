server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/hemlock/client/dist;

    # TLS ends at the owner's proxy, so a redirect must keep the browser's scheme and host.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_vary on;

    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /covers/ {
        alias /var/lib/hemlock/covers/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        # The server caps a cover at 10 MB; the multipart body around it needs the margin.
        client_max_body_size 12m;
    }

    # The live updates stream stays open for hours: unbuffered, and the server pings every 25 s.
    location = /api/events {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # A Claude lookup or cover search makes up to three requests of up to 90 seconds each; nginx's default is 60 s.
    location ~ ^/api/(lookup/[^/]+/identify|books/[0-9]+/cover/find)$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
